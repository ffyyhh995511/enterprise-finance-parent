server:
  port: 8081

spring:
  application:
    name: enterprise-finance-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: localhost:18858
        port: 8719
      eager: true
      datasource:
        degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            data-id: enterprise-finance-user-sentinel-degrade
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            data-id: enterprise-finance-user-sentinel-flow
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  config:
    import:
      - optional:nacos:enterprise-finance-common.yml
      - optional:nacos:${spring.application.name}.yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: enterprise_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace:
      username: nacos
      password: nacos
      application: seata-server
      cluster: default
  service:
    vgroup-mapping:
      enterprise_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

# 生产者：starter 在同时存在 name-server + producer.group 时自动注册 DefaultMQProducer / RocketMQTemplate
rocketmq:
  # 多个 NameServer 用分号分隔，例如 192.168.0.10:9876;192.168.0.11:9876
  name-server: 127.0.0.1:9876
  # access-key / secret-key / namespace：生产集群开 ACL 或多租户时再打开
  # access-key:
  # secret-key:
  producer:
    group: user-demo-producer
    # 同步发送等待 Broker ACK 的超时，单位毫秒
    send-message-timeout: 3000
    # 同步发送失败后的内部重试次数（不含首次）；重试可能导致重复，消费端需幂等
    retry-times-when-send-failed: 2
    # 异步发送失败后的内部重试次数
    retry-times-when-send-async-failed: 2
    # 发送失败时换另一台 Broker 再试，降低单节点抖动影响
    retry-next-server: true
    # 单条消息体上限，单位字节，默认 4MB
    max-message-size: 4194304
    # 消息体超过该字节数则压缩后再发送，默认 4KB
    compress-message-body-threshold: 4096
    # 打开消息轨迹，可在 Dashboard 查发送/消费链路；本地 Broker 需能自动建轨迹 Topic
    enable-msg-trace: true

demo:
  message: user local default
  timeout-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
