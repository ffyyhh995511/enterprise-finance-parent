brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
namesrvAddr = rocketmq-namesrv:9876
listenPort = 10911
autoCreateTopicEnable = true
# 宿主机访问 Broker 用的 IP，必须改成你本机局域网 IPv4（与 Seata 的 SEATA_IP 同一套）
# 不要写 127.0.0.1，否则 IDE 里的微服务连不上容器里的 Broker
brokerIP1 = 192.168.0.110
